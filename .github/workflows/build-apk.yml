name: Build OneGo Android app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug -PONEGO_VERSION_CODE="$GITHUB_RUN_NUMBER" -PONEGO_VERSION_NAME="1.0.$GITHUB_RUN_NUMBER"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OneGo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Check if release signing is configured
        id: signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SIGNING_KEYSTORE: ${{ secrets.ONEGO_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ONEGO_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ONEGO_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ONEGO_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$SIGNING_KEYSTORE" && -n "$SIGNING_STORE_PASSWORD" && -n "$SIGNING_KEY_ALIAS" && -n "$SIGNING_KEY_PASSWORD" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Release signing is not configured; the debug APK is available as a workflow artifact."
          fi

      - name: Restore release signing key
        if: steps.signing.outputs.enabled == 'true'
        env:
          SIGNING_KEYSTORE: ${{ secrets.ONEGO_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/onego-release.jks"

      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          ONEGO_STORE_PASSWORD: ${{ secrets.ONEGO_STORE_PASSWORD }}
          ONEGO_KEY_ALIAS: ${{ secrets.ONEGO_KEY_ALIAS }}
          ONEGO_KEY_PASSWORD: ${{ secrets.ONEGO_KEY_PASSWORD }}
        shell: bash
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          gradle --no-daemon assembleRelease \
            -PONEGO_KEYSTORE_PATH="$RUNNER_TEMP/onego-release.jks" \
            -PONEGO_STORE_PASSWORD="$ONEGO_STORE_PASSWORD" \
            -PONEGO_KEY_ALIAS="$ONEGO_KEY_ALIAS" \
            -PONEGO_KEY_PASSWORD="$ONEGO_KEY_PASSWORD" \
            -PONEGO_VERSION_CODE="$GITHUB_RUN_NUMBER" \
            -PONEGO_VERSION_NAME="$VERSION_NAME"
          cp app/build/outputs/apk/release/app-release.apk app-release.apk

      - name: Publish signed APK on GitHub Release
        if: steps.signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" app-release.apk --title "$GITHUB_REF_NAME" --notes "OneGo BackLoad Android app release."
